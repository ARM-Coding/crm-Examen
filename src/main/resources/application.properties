spring.application.name=crmExamen

# Configuracion del servidor web embebido Tomcat 11
server.port=8080

# Conexion JDBC
spring.datasource.url=jdbc:mariadb://localhost:3306/crmExamen
spring.datasource.username=dev
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuracion de JPA / Hibernate (Jakarta Persistence)
spring.jpa.properties.hibernate.default_schema=crmExamen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true